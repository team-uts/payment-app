spring:
  datasource:
    common:
      hikari:
    source:
      hikari:
        poolName: source-test-pool
        driverClassName: org.h2.Driver
        jdbcUrl: jdbc:h2:mem:test;INIT=CREATE SCHEMA IF NOT EXISTS PRAYERHOUSE;
        username: sa
        password:
    replica:
      hikari:
        poolName: replica-test-pool
        driverClassName: org.h2.Driver
        jdbcUrl: jdbc:h2:mem:test;INIT=CREATE SCHEMA IF NOT EXISTS PRAYERHOUSE;
        username: sa
        password:

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        default_batch_fetch_size: 100
        use_sql_comments: true  # can see JPQL query

