spring:
  datasource:
    source:
      hikari:
        poolName: source-pool
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://localhost:3306/payment?characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: payment
        maximumPoolSize: 5
        minimumIdle: 5
    replica:
      hikari:
        poolName: replica-pool
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://localhost:3307/payment?characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: payment
        maximumPoolSize: 5
        minimumIdle: 5

  data:
    redis:
      host: localhost
      username: "${REDIS_USERNAME}"
      password: "${REDIS_PASSWORD}"
      port: 6379
      ssl:
        enabled: false
      database: 0
      connect-timeout: 3000
      timeout: 3000
      lettuce:
        pool:
          max-active: 3
          max-idle: 3
          min-idle: 3
          max-wait: 3000
      redisson:
        pool:
          max-active: 3
          min-idle: 3

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com.zaxxer.hikari.HikariConfig: DEBUG
