spring:
  datasource:
    source:
      hikari:
        poolName: source-pool
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://localhost:3306/payment?characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: payment
        maximumPoolSize: 5
        minimumIdle: 5
    replica:
      hikari:
        poolName: replica-pool
        driverClassName: com.mysql.cj.jdbc.Driver
        jdbcUrl: jdbc:mysql://localhost:3307/payment?characterEncoding=utf8&serverTimezone=UTC
        username: root
        password: payment
        maximumPoolSize: 5
        minimumIdle: 5
