spring:
  datasource:
    common:
      hikari:
        connectionTimeout: 3000
        validationTimeout: 1000
        maxLifetime: 1800000 # 30 minutes (default)
        connectionTestQuery: SELECT 1
        dataSource:
          autoReconnect: true
          cachePrepStmts: true
          prepStmtCacheSize: 250
          prepStmtCacheSqlLimit: 2048
          useServerPrepStmts: true
          connectTimeout: 2000
          socketTimeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 100 # JPA OneToMany
        query.in_clause_parameter_padding: true # in clause cache
        query.plan_parameter_metadata_max_size: 64