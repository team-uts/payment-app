spring:
  application:
    name: payment-app
  profiles:
    active: local

  lifecycle:
    timeout-per-shutdown-phase: 30s # default 30s (graceful shutdown)

  messages:
    encoding: UTF-8
    fallback-to-system-locale: false

  mvc:
    problemdetails:
      enabled: true
      base-url: "${PROBLEM_DETAIL_BASE_URL}"

server:
  shutdown: graceful
