name: "payment-db"
services:
  source-db:
    image: mysql:8.0.41
    container_name: payment-source-db
    restart: "no"
    volumes:
      - ${DB_SETUP_DIR}/source/data:/var/lib/mysql:rw
      - ${DB_SETUP_DIR}/source/log:/var/log/mysql
      - ${DB_SETUP_DIR}/source/my-local.cnf:/etc/my.cnf
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"

  replica-db:
    image: mysql:8.0.41
    container_name: payment-replica-db
    restart: "no"
    volumes:
      - ${DB_SETUP_DIR}/replica/data:/var/lib/mysql:rw
      - ${DB_SETUP_DIR}/replica/log:/var/log/mysql
      - ${DB_SETUP_DIR}/replica/my-local.cnf:/etc/my.cnf
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"

  redis:
    image: redis:8.8.4-alpine
    container_name: payment-redis
    restart: "no"
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:4.2.2
    hostname: payment-kafka
    container_name: payment-kafka
    restart: "no"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://payment-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@payment-kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://payment-kafka:29092,CONTROLLER://payment-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
  # kafka UI (kafbat)
  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: payment-kafbat-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: payment-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: payment-kafka:29092
